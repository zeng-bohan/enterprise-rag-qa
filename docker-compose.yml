# 企业知识库 RAG 问答系统 —— 基础设施一键部署
# 用法：docker compose up -d
# 启动：PostgreSQL 16 + pgvector（向量库）、Redis 7（缓存）
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragkb-postgres
    environment:
      POSTGRES_USER: ragkb
      POSTGRES_PASSWORD: ragkb123
      POSTGRES_DB: rag_kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped  # Docker Desktop 开机自启后容器自动恢复
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragkb -d rag_kb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ragkb-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped  # Docker Desktop 开机自启后容器自动恢复
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
