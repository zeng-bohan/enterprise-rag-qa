[pytest]
# 两套测试的分工写在这里，避免贡献者把「离线套件全绿」误读成「后端已验证」：
#   -m "not contract"  不需要 Docker、不下载模型，任何人 clone 即可跑
#   -m contract        真 Postgres + 真 Chroma，跑双后端契约（CI 的 contract job）
#   -m contract_model  真 BGE / 真 cross-encoder 冒烟，需下载模型，默认不跑
markers =
    contract: 后端契约测试，需要 PostgreSQL（docker compose up -d）
    contract_model: 需要下载真实 embedding / rerank 模型
testpaths = tests
filterwarnings =
    # langchain-chroma 在样本量很小时会提示相关度分数不可靠；契约测试比的是
    # 两后端对同一输入的换算是否一致，与该提示无关，压掉以免噪音淹没真失败
    ignore:.*Relevance scores may not be reliable.*:UserWarning
